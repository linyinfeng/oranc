name: "Automated update"
on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: automated-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      oranc:
        image: ghcr.io/linyinfeng/oranc
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: main
          token: "${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}"
      - name: Install nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Setup cachix
        uses: cachix/cachix-action@master
        with:
          name: linyinfeng
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
      - name: Git config
        run: |
          git config --global user.email "nano@linyinfeng.com"
          git config --global user.name "Nano"
      - name: Nix flake update
        run: |
          nix flake update --commit-lock-file
      - name: Cargo update
        run: |
          nix develop --command cargo update
          if [ -z $(git status --porcelain) ]; then
            echo "clean, skip..."
          else
            git add --all
            git commit --message "Cargo update"
          fi
      - name: Nix flake check
        run: |
          nix flake check
      - name: Open update pull request
        env:
          GH_TOKEN: ${{ secrets.PAT_FOR_AUTOMATED_UPDATE }}
        run: |
          if git diff --quiet origin/main HEAD; then
            echo "no changes relative to main, skip update PR"
            exit 0
          fi

          branch=automated-update
          previous_head=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          git push --force-with-lease="refs/heads/$branch:$previous_head" origin "HEAD:refs/heads/$branch"

          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$GITHUB_REPOSITORY" --add-label "auto update"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Automated update" --label "auto update" \
              --body "Update Nix flake inputs and Cargo dependencies."
          fi
