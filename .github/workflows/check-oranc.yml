name: "Check with oranc"
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-signing-key:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      available: ${{ steps.signing-key.outputs.available }}
    steps:
      - name: Check signing key availability
        id: signing-key
        run: echo "available=${{ secrets.ORANC_SIGNING_KEY != '' }}" >> "$GITHUB_OUTPUT"

  check:
    needs: check-signing-key
    if: ${{ needs.check-signing-key.outputs.available == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      oranc:
        image: ghcr.io/linyinfeng/oranc
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Install nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Setup oranc
        uses: linyinfeng/oranc-action@main
        with:
          orancServerContainer: "${{ job.services.oranc.id }}"
          signingKey: "${{ secrets.ORANC_SIGNING_KEY }}"
      - name: Nix flake check
        run: nix flake check
